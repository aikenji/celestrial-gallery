<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Gallery | Aiken Astrophotography</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/gallery.css">
    <script src="data/gallery-data.js" defer></script>
    <script src="data/messier-catalog.js" defer></script>
    <script src="scripts/gallery-logger.js" defer></script>
    <script src="scripts/gallery-core.js" defer></script>
    <script src="scripts/gallery-astro.js" defer></script>
    <script src="scripts/gallery-likes.js" defer></script>
    <script src="messier/gallery-messier-data.js" defer></script>
    <script src="messier/gallery-messier-constellations.js" defer></script>
    <script src="messier/gallery-messier.js" defer></script>
    <script src="scripts/gallery-ui.js" defer></script>
    <script src="scripts/gallery.js" defer></script>
</head>
<body>
    <div class="stars-container" id="stars-container"></div>

    <header>
        <div class="header-controls">
            <button class="search-toggle" id="search-toggle" type="button" aria-label="Toggle Search">
                <span class="search-icon"></span>
            </button>
            <div class="search-container" id="search-container">
                <input type="text" id="search-input" placeholder="Global search..." aria-label="Search all photos">
            </div>
        </div>
        <div class="subtitle">Aiken Astrophotography</div>
        <h1 class="gallery-title" id="gallery-title">
            <span class="title-layer title-layer-current">CELESTIAL GALLERY</span>
            <span class="title-layer title-layer-next" aria-hidden="true"></span>
        </h1>
        <nav id="nav-group"></nav>
    </header>

    <section class="messier-chart-panel" id="messier-chart-panel" hidden>
        <div class="messier-chart-shell">
            <div class="messier-chart-header">
                <div class="messier-chart-copy">
                    <div class="messier-chart-kicker">Messier Sky Chart</div>
                    <div class="messier-chart-title">All 110 Messier Targets</div>
                </div>
                <div class="messier-chart-stats">
                    <span class="messier-stat-value" id="messier-captured-count">0</span>
                    <span class="messier-stat-divider">/</span>
                    <span class="messier-stat-total" id="messier-total-count">110</span>
                    <span class="messier-stat-label">captured</span>
                </div>
            </div>
            <div class="messier-chart-legend" aria-hidden="true">
                <div class="messier-legend-group">
                    <span class="messier-legend-item">
                        <span class="messier-legend-shape is-nebula"></span>
                        Nebula
                    </span>
                    <span class="messier-legend-item">
                        <span class="messier-legend-shape is-cluster"></span>
                        Cluster
                    </span>
                    <span class="messier-legend-item">
                        <span class="messier-legend-shape is-galaxy"></span>
                        Galaxy
                    </span>
                </div>
            </div>
            <div class="messier-chart-frame">
                <svg id="messier-chart" class="messier-chart" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Messier sky chart"></svg>
                <div class="messier-hover-card" id="messier-hover-card" hidden>
                    <img class="messier-hover-image" id="messier-hover-image" alt="">
                    <div class="messier-hover-copy">
                        <div class="messier-hover-id" id="messier-hover-id"></div>
                        <div class="messier-hover-meta" id="messier-hover-meta"></div>
                    </div>
                </div>
            </div>
            <div class="messier-chart-footer">
                <div class="messier-chart-toggles">
                    <div class="messier-view-toggle-container">
                        <button class="messier-view-toggle" id="toggle-polar" type="button" aria-label="Toggle View Mode">
                            <span class="view-label">Flat</span>
                            <div class="view-switch-track">
                                <span class="view-switch-knob"></span>
                            </div>
                            <span class="view-label">3D</span>
                        </button>
                    </div>
                    <button class="messier-toggle-btn" id="toggle-play" type="button" aria-label="Play/Pause Rotation" hidden>
                        <span class="toggle-icon is-play"></span>
                    </button>
                    <div class="messier-toggle-divider"></div>
                    <button class="messier-toggle-btn" id="toggle-ecliptic" type="button">
                        <span class="toggle-icon"></span>
                        Ecliptic
                    </button>
                    <button class="messier-toggle-btn" id="toggle-planets" type="button">
                        <span class="toggle-icon"></span>
                        Planets
                    </button>
                    <button class="messier-toggle-btn" id="toggle-constellations" type="button">
                        <span class="toggle-icon"></span>
                        Constellations
                    </button>
                </div>
            </div>
        </div>
        <div class="messier-altitude-shell">
            <div class="messier-altitude-header">
                <div class="messier-altitude-kicker">Sun / Moon</div>
                <div class="messier-altitude-controls">
                    <input class="messier-date-input" id="messier-date-input" type="date" aria-label="Select date">
                    <button class="messier-date-btn" id="messier-date-prev" type="button" aria-label="Previous date">Prev</button>
                    <button class="messier-date-btn" id="messier-date-today" type="button" aria-label="Today">Today</button>
                    <button class="messier-date-btn" id="messier-date-next" type="button" aria-label="Next date">Next</button>
                </div>
            </div>
            <div class="messier-altitude-frame">
                <svg id="messier-altitude-chart" class="messier-chart messier-altitude-chart" viewBox="0 0 1200 240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sun and moon altitude chart"></svg>
            </div>
        </div>
    </section>

    <main class="gallery" id="gallery"></main>

    <div id="lightbox" onclick="this.style.display='none'">
        <img src="" id="lightbox-img">
    </div>

    <footer>
        <p>&copy; 2026 Astrophotography Collection &middot; Keep Looking Up</p>
    </footer>
</body>
</html>
